<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOJ — Comment Sentiment & Stance Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10 px-6 py-4">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
          ⚡
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight">MOJ · Comment Classifier</h1>
          <p class="text-xs text-slate-400">Robust Probability Readout · Customizable Sentiments & Stances</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <!-- Model Selector -->
        <select id="modelSelect" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <option value="qwen3.5-judge" selected>Model: Qwen3.5-9B (100% GPU)</option>
          <option value="comment-judge">Model: DeepSeek-V4-Pro-9B</option>
        </select>
        <!-- Status Pill -->
        <div class="flex items-center space-x-2 text-xs font-medium px-3 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-500/30 text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Live 24/7</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">

    <!-- Config & Target Bar -->
    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
      <!-- Target entity for stance -->
      <div class="flex items-center space-x-2 flex-1 min-w-[280px]">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide whitespace-nowrap">Stance Target:</span>
        <input
          id="targetInput"
          type="text"
          value="Cockroach Janta Party"
          placeholder="e.g. Cockroach Janta Party, Modi, School Reform, Brand"
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Sentiment Granularity -->
      <div class="flex items-center space-x-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Sentiment:</span>
        <select id="sentimentMode" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <option value="standard" selected>Standard (3-class)</option>
          <option value="fine">Fine-Grained + Sarcasm (5-class)</option>
        </select>
      </div>

      <!-- Extra Tasks Checkboxes -->
      <div class="flex items-center space-x-3 text-xs">
        <label class="flex items-center space-x-1.5 text-slate-300 cursor-pointer">
          <input type="checkbox" id="checkHate" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
          <span>Hate & Abuse</span>
        </label>
        <label class="flex items-center space-x-1.5 text-slate-300 cursor-pointer">
          <input type="checkbox" id="checkSupport" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
          <span>Stance</span>
        </label>
        <label class="flex items-center space-x-1.5 text-slate-300 cursor-pointer">
          <input type="checkbox" id="checkIntent" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
          <span>Intent</span>
        </label>
        <span class="text-slate-700">|</span>
        <label class="flex items-center space-x-1.5 text-amber-300 font-medium cursor-pointer" title="Runs 3 cyclic option permutations and averages probabilities to 100% remove letter position bias">
          <input type="checkbox" id="checkDebias" class="rounded bg-slate-800 border-slate-700 text-amber-500 focus:ring-0">
          <span>🛡️ Cyclic Debiasing</span>
        </label>
      </div>
    </div>

    <!-- Input Section -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <label for="commentInput" class="text-sm font-semibold text-slate-300">Comment Text</label>
        <span id="charCount" class="text-xs text-slate-500">0 characters</span>
      </div>

      <textarea
        id="commentInput"
        rows="3"
        placeholder="Type or paste any comment (English, Hindi, Hinglish, emojis, sarcasm)..."
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm leading-relaxed"
      ></textarea>

      <!-- Post Context Field (Optional) -->
      <div>
        <label for="postContextInput" class="text-xs font-semibold text-slate-400 block mb-1">
          Post Caption / Context <span class="text-slate-600 font-normal">(Optional — provides context for sarcasm & stance)</span>
        </label>
        <input
          id="postContextInput"
          type="text"
          placeholder="e.g. Introducing our new social media team..."
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs"
        />
      </div>

      <!-- Quick samples -->
      <div class="flex flex-wrap items-center gap-2 pt-1">
        <span class="text-xs font-medium text-slate-400">Quick test:</span>
        <button onclick="setSample('Adivasi school repair is essential, full support to Cockroach Janta Party! 🙌', 'Cockroach Janta Party')" class="sample-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60 transition">
          🙌 Support CJP
        </button>
        <button onclick="setSample('Narendra Modi resign button 👇', 'Narendra Modi')" class="sample-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60 transition">
          👇 Resign Button (Target: Modi)
        </button>
        <button onclick="setSample('ye bta bhadwe tmko kaun sa post mili bartan saf krne ka', 'Cockroach Janta Party')" class="sample-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60 transition">
          ⚠️ Abusive Hindi Slurs
        </button>
        <button onclick="setSample('Great job destroying the economy, truly masterclass 👏', 'Government Policy')" class="sample-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60 transition">
          😏 Sarcastic Irony
        </button>
      </div>

      <!-- Custom Task Accordion -->
      <div class="border-t border-slate-800/80 pt-3">
        <button type="button" onclick="toggleCustomTask()" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 flex items-center space-x-1.5">
          <span id="customArrow">▶</span>
          <span>+ Add Custom Task / Custom Options (Up to 8 choices)</span>
        </button>

        <div id="customTaskPanel" class="hidden mt-3 p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-3 text-xs">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-400 font-medium mb-1">Custom Task Key (e.g. urgency, authenticity)</label>
              <input id="customTaskKey" type="text" placeholder="e.g. urgency" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200">
            </div>
            <div>
              <label class="block text-slate-400 font-medium mb-1">Question</label>
              <input id="customQuestion" type="text" placeholder="e.g. How urgent is this comment issue?" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200">
            </div>
          </div>
          <div>
            <label class="block text-slate-400 font-medium mb-1">Options (comma-separated, 2 to 8 items)</label>
            <input id="customOptions" type="text" placeholder="e.g. critical action needed, moderate inquiry, casual remark" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200">
          </div>
        </div>
      </div>

      <!-- Action Row -->
      <div class="flex items-center justify-between pt-2">
        <span class="text-xs text-slate-500">Shortcut: <kbd class="px-1.5 py-0.5 bg-slate-800 rounded text-slate-400 border border-slate-700">Ctrl</kbd> + <kbd class="px-1.5 py-0.5 bg-slate-800 rounded text-slate-400 border border-slate-700">Enter</kbd></span>
        <button
          id="analyzeBtn"
          onclick="analyzeComment()"
          class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-6 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition disabled:opacity-50"
        >
          <span id="btnSpinner" class="hidden">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
          <span id="btnText">Analyze Comment</span>
        </button>
      </div>
    </div>

    <!-- Results Section -->
    <div id="resultsContainer" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Classification Breakdown</h2>
        <div class="flex items-center space-x-3 text-xs text-slate-500">
          <span id="targetEcho" class="bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full"></span>
          <span id="latencyBadge" class="bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full"></span>
        </div>
      </div>

      <!-- Dynamic Grid for Cards -->
      <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Rendered dynamically by renderResults() -->
      </div>
    </div>

  </main>

  <script>
    const commentInput = document.getElementById('commentInput');
    const charCount = document.getElementById('charCount');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const resultsContainer = document.getElementById('resultsContainer');
    const cardsGrid = document.getElementById('cardsGrid');
    const latencyBadge = document.getElementById('latencyBadge');
    const targetEcho = document.getElementById('targetEcho');

    let customOpen = false;
    function toggleCustomTask() {
      customOpen = !customOpen;
      document.getElementById('customTaskPanel').classList.toggle('hidden', !customOpen);
      document.getElementById('customArrow').textContent = customOpen ? '▼' : '▶';
    }

    commentInput.addEventListener('input', () => {
      charCount.textContent = `${commentInput.value.length} characters`;
    });

    commentInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        analyzeComment();
      }
    });

    function setSample(text, target) {
      commentInput.value = text;
      charCount.textContent = `${text.length} characters`;
      if (target) {
        document.getElementById('targetInput').value = target;
      }
      analyzeComment();
    }

    async function analyzeComment() {
      const text = commentInput.value.trim();
      if (!text) {
        alert('Please enter a comment.');
        return;
      }

      analyzeBtn.disabled = true;
      btnSpinner.classList.remove('hidden');
      btnText.textContent = 'Classifying...';

      // Build task list
      const tasks = [];
      const sentimentMode = document.getElementById('sentimentMode').value;
      if (sentimentMode === 'fine') {
        tasks.push('sentiment_fine');
      } else {
        tasks.push('sentiment');
      }

      if (document.getElementById('checkHate').checked) tasks.push('hate');
      if (document.getElementById('checkSupport').checked) tasks.push('support');
      if (document.getElementById('checkIntent').checked) tasks.push('intent');

      const target = document.getElementById('targetInput').value.trim();
      const model = document.getElementById('modelSelect').value;
      const postContext = document.getElementById('postContextInput').value.trim();

      // Custom tasks if configured
      let custom_tasks = null;
      const cKey = document.getElementById('customTaskKey').value.trim();
      const cQ = document.getElementById('customQuestion').value.trim();
      const cOpts = document.getElementById('customOptions').value.trim();
      if (cKey && cQ && cOpts) {
        const optsList = cOpts.split(',').map(s => s.trim()).filter(s => s.length > 0);
        if (optsList.length >= 2) {
          custom_tasks = {
            [cKey]: { question: cQ, options: optsList }
          };
        }
      }

      const payload = {
        text,
        tasks,
        target: target || 'the subject / campaign',
        post_context: postContext || null,
        model,
        debias: document.getElementById('checkDebias').checked,
        custom_tasks,
      };

      try {
        const resp = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          const err = await resp.json();
          alert('Error: ' + (err.detail || 'Analysis failed'));
          return;
        }

        const data = await resp.json();
        renderResults(data);
      } catch (err) {
        alert('Failed to connect to backend: ' + err.message);
      } finally {
        analyzeBtn.disabled = false;
        btnSpinner.classList.add('hidden');
        btnText.textContent = 'Analyze Comment';
      }
    }

    function renderResults(data) {
      resultsContainer.classList.remove('hidden');
      latencyBadge.textContent = `Latency: ${data.elapsed_ms} ms (${data.model})`;
      targetEcho.textContent = `Target: ${data.target || 'General'}`;

      cardsGrid.innerHTML = '';
      const res = data.results;

      // Adjust grid columns
      const count = Object.keys(res).length;
      if (count === 1) cardsGrid.className = 'grid grid-cols-1 max-w-md gap-4';
      else if (count === 2) cardsGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
      else cardsGrid.className = 'grid grid-cols-1 md:grid-cols-3 gap-4';

      for (const [taskKey, taskData] of Object.entries(res)) {
        const card = createCard(taskKey, taskData);
        cardsGrid.appendChild(card);
      }
    }

    function createCard(taskKey, d) {
      const card = document.createElement('div');
      card.className = 'bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4 relative overflow-hidden';

      let title = taskKey.toUpperCase().replace('_', ' ');
      if (taskKey === 'support') title = 'STANCE';

      // Badge style
      let badgeColor = 'bg-slate-500/20 text-slate-300 border-slate-500/30';
      const lbl = d.label.toLowerCase();
      if (lbl.includes('positive') || lbl === 'supports' || lbl === 'neither' && taskKey === 'hate') {
        badgeColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
      } else if (lbl.includes('negative') || lbl === 'opposes' || lbl === 'hateful') {
        badgeColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
      } else if (lbl.includes('offensive') || lbl.includes('sarcastic')) {
        badgeColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
      } else if (lbl === 'supports') {
        badgeColor = 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30';
      }

      let flagHtml = '';
      if (d.flag) {
        flagHtml = '<span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">Flagged</span>';
      } else if (d.needs_review) {
        flagHtml = '<span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">Review</span>';
      }

      // Probability bars
      let barsHtml = '';
      if (d.probs) {
        for (const [opt, p] of Object.entries(d.probs)) {
          const pct = Math.round(p * 100);
          barsHtml += `
            <div class="space-y-1 text-xs">
              <div class="flex justify-between text-slate-400">
                <span class="capitalize truncate pr-2">${opt}</span>
                <span class="font-mono font-medium">${pct}%</span>
              </div>
              <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                <div class="bg-indigo-500 h-1.5 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        }
      }

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">${title}</span>
          ${flagHtml}
        </div>
        <div>
          <div class="inline-block text-lg font-bold px-3 py-1 rounded-xl border ${badgeColor}">
            ${d.label.toUpperCase()}
          </div>
          <div class="text-xs text-slate-400 mt-1">Confidence: ${(d.confidence * 100).toFixed(1)}%</div>
        </div>
        <div class="space-y-2 pt-2 border-t border-slate-800/80">
          ${barsHtml}
        </div>
      `;
      return card;
    }
  </script>
</body>
</html>
